blueprint:
  name: Zigbee2MQTT - 3 Button Green Power
  description: >-
    Blueprint for 3-button Zigbee Green Power wireless switch (battery-free)
    via Zigbee2MQTT. Supports off, on, and recall_scene1 actions.
  domain: automation
  source_url: https://github.com/fapgomes/ha-blueprints/blob/main/zigbee2mqtt-green_power_button.yaml
  input:
    mode:
      name: Automation Modes
      description: https://www.home-assistant.io/docs/automation/modes/
      default: single
      selector:
        select:
          mode: dropdown
          options:
            - single
            - restart
            - queued
            - parallel
    remote:
      name: greenpower button
      description: Button GreenPower
      selector:
        entity:
          domain:
          - event
          multiple: true
    "off":
      name: Button 1 (Off)
      description: Action to run on the first button press
      default: []
      selector:
        action: {}
    "on":
      name: Button 2 (On)
      description: Action to run on the second button press
      default: []
      selector:
        action: {}
    recall_scene1:
      name: Button 3 (Scene)
      description: Action to run on the third button press
      default: []
      selector:
        action: {}
mode: !input mode
max_exceeded: silent
trigger:
  - platform: state
    entity_id: !input remote
    not_to:
      - unavailable
      - unknown
variables:
  event_type: "{{ trigger.to_state.attributes.event_type | default('') }}"
condition:
  - "{{ event_type in ['on', 'off', 'recall_scene1'] }}"
  # stale-restore guard: an event entity's state IS the receipt timestamp of
  # its last event. A genuine press is stamped ~now; a state restored after an
  # availability flap (z2m restart, MQTT reconnect) carries the *original*,
  # old timestamp, which is what replays the last press. Rejecting anything
  # older than 5s blocks that. This replaces a `not_from: [unavailable,
  # unknown]` filter: not_from also swallows the first genuine press after an
  # HA restart, because restored event entities start at `unknown`
  # (home-assistant/core#142263). The freshness test has no such blind spot,
  # and being mechanism-independent it also covers a retained-MQTT replay.
  # as_timestamp(..., 0) makes an unparseable state fail closed.
  - condition: template
    value_template: >-
      {{ (now().timestamp() - as_timestamp(trigger.to_state.state, 0)) < 5 }}
action:
  - choose:
      - conditions:
          - "{{ event_type == 'on' }}"
        sequence: !input "on"
      - conditions:
          - "{{ event_type == 'off' }}"
        sequence: !input "off"
      - conditions:
          - "{{ event_type == 'recall_scene1' }}"
        sequence: !input recall_scene1
    default:
      - action: logbook.log
        data:
          name: "Zigbee2MQTT - 3 Button Green Power"
          message: "event_type=={{ event_type }}"
