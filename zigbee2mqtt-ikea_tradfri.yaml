blueprint:
  name: Zigbee2MQTT - IKEA tradfri
  description: >-
    Blueprint for IKEA TRADFRI Shortcut Button (E1812) via Zigbee2MQTT.
    Supports single press, double press, long press, and release actions.
  domain: automation
  source_url: https://github.com/fapgomes/ha-blueprints/blob/main/zigbee2mqtt-ikea_tradfri.yaml
  input:
    mode:
      name: Automation Modes
      description: https://www.home-assistant.io/docs/automation/modes/
      default: single
      selector:
        select:
          mode: dropdown
          options:
            - single
            - restart
            - queued
            - parallel
    remote:
      name: tradfri button
      description: Button for IKEA tradfri 
      selector:
        entity:
          domain:
          - event
          multiple: true
    "on":
      name: Single Press
      description: Action to run on single press
      default: []
      selector:
        action: {}
    "off":
      name: Double Press
      description: Action to run on double press
      default: []
      selector:
        action: {}
    brightness_move_up:
      name: Long Press
      description: Action to run on long press (hold)
      default: []
      selector:
        action: {}
    brightness_stop:
      name: Release
      description: Action to run when button is released after long press
      default: []
      selector:
        action: {}
mode: !input mode
max_exceeded: silent
trigger:
  - platform: state
    entity_id: !input remote
    not_to:
      - unavailable
      - unknown
condition:
  # 1. an actual action must be present.
  #    `not in [none, '']` rather than `| default('') != ''`: Jinja's default
  #    filter only substitutes for an *undefined* value, so an attribute that
  #    is explicitly None passes the default() form and leaks through.
  - condition: template
    value_template: >-
      {{ trigger.to_state.attributes.event_type | default('') not in [none, ''] }}
  # 2. stale-restore guard: an event entity's state IS the receipt timestamp of
  #    its last event. A genuine press is stamped ~now; a state restored after an
  #    availability flap (z2m restart, MQTT reconnect) carries the *original*,
  #    old timestamp, which is what replays the last press. Rejecting anything
  #    older than 5s blocks that. This replaces a `not_from: [unavailable,
  #    unknown]` filter: not_from also swallows the first genuine press after an
  #    HA restart, because restored event entities start at `unknown`
  #    (home-assistant/core#142263). The freshness test has no such blind spot,
  #    and being mechanism-independent it also covers a retained-MQTT replay.
  #    as_timestamp(..., 0) makes an unparseable state fail closed.
  - condition: template
    value_template: >-
      {{ (now().timestamp() - as_timestamp(trigger.to_state.state, 0)) < 5 }}
action:
  - variables:
      event_type: "{{ trigger.to_state.attributes.event_type }}"
  - choose:
      - conditions:
          - "{{ event_type == 'on' }}"
        sequence: !input "on"
      - conditions:
          - "{{ event_type == 'off' }}"
        sequence: !input "off"
      - conditions:
          - "{{ event_type == 'brightness_move_up' }}"
        sequence: !input brightness_move_up
      - conditions:
          - "{{ event_type == 'brightness_stop' }}"
        sequence: !input brightness_stop
    default:
      - action: logbook.log
        data:
          name: "Zigbee2MQTT - IKEA tradfri"
          message: "event_type=={{ event_type }}"
