blueprint:
  name: Zigbee2MQTT - Nedis remote
  description: >-
    Blueprint for Nedis Zigbee security remote via Zigbee2MQTT.
    Supports arm all zones, emergency, arm day zones, and disarm buttons.
  domain: automation
  source_url: https://github.com/fapgomes/ha-blueprints/blob/main/zigbee2mqtt-nedis-remote.yaml
  input:
    mode:
      name: Automation Modes
      description: https://www.home-assistant.io/docs/automation/modes/
      default: single
      selector:
        select:
          mode: dropdown
          options:
            - single
            - restart
            - queued
            - parallel
    remote:
      name: Nedis button
      description: Button for nedis remote
      selector:
        entity:
          domain:
          - event
          multiple: true
    arm_all_zones:
      name: arm_all_zones button
      description: Action to run top right button with single press
      default: []
      selector:
        action: {}
    emergency:
      name: emergency button
      description: Action to run top left button with single press
      default: []
      selector:
        action: {}
    arm_day_zones:
      name: arm_day_zones button
      description: Action to run bottom left button with single press
      default: []
      selector:
        action: {}
    disarm:
      name: disarm button
      description: Action to run bottom right button with single press
      default: []
      selector:
        action: {}
mode: !input mode
max_exceeded: silent
trigger:
  - platform: state
    entity_id: !input remote
    not_to:
      - unavailable
      - unknown
condition:
  # 1. an actual action must be present.
  #    `not in [none, '']` rather than `| default('') != ''`: Jinja's default
  #    filter only substitutes for an *undefined* value, so an attribute that
  #    is explicitly None passes the default() form and leaks through.
  - condition: template
    value_template: >-
      {{ trigger.to_state.attributes.event_type | default('') not in [none, ''] }}
  # 2. stale-restore guard: an event entity's state IS the receipt timestamp of
  #    its last event. A genuine press is stamped ~now; a state restored after an
  #    availability flap (z2m restart, MQTT reconnect) carries the *original*,
  #    old timestamp, which is what replays the last press. Rejecting anything
  #    older than 5s blocks that. This replaces a `not_from: [unavailable,
  #    unknown]` filter: not_from also swallows the first genuine press after an
  #    HA restart, because restored event entities start at `unknown`
  #    (home-assistant/core#142263). The freshness test has no such blind spot,
  #    and being mechanism-independent it also covers a retained-MQTT replay.
  #    as_timestamp(..., 0) makes an unparseable state fail closed.
  - condition: template
    value_template: >-
      {{ (now().timestamp() - as_timestamp(trigger.to_state.state, 0)) < 5 }}
action:
  - variables:
      event_type: "{{ trigger.to_state.attributes.event_type }}"
  - choose:
      - conditions:
          - "{{ event_type == 'arm_all_zones' }}"
        sequence: !input arm_all_zones
      - conditions:
          - "{{ event_type == 'emergency' }}"
        sequence: !input emergency
      - conditions:
          - "{{ event_type == 'arm_day_zones' }}"
        sequence: !input arm_day_zones
      - conditions:
          - "{{ event_type == 'disarm' }}"
        sequence: !input disarm
    default:
      - action: logbook.log
        data:
          name: "Zigbee2MQTT - Nedis remote"
          message: "event_type=={{ event_type }}"
